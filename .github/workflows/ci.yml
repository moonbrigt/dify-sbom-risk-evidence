name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression-suite:
    name: 离线回归套件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: 运行离线回归套件（fixture 金矩阵 + schema + sha 链 + 图完整性）
        run: python3 tools/regression_suite.py

  dsl-determinism:
    name: DSL 确定性门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: 重新生成 DSL，未提交变更则失败
        run: |
          python3 tools/build_native_graph.py
          git diff --exit-code -- dify/
      - name: 工作流代码节点 lint（pyflakes 子集）
        run: python3 -m ruff check tools --select F401,F811,F841,E9,F63,F7

  node-tools:
    name: 浏览器自动化工具语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check tools/cdp.js
      - run: node --check tools/deploy_draft.js
      - run: node --check tools/run_workflow.js
