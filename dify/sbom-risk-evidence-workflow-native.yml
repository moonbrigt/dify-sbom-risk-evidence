    - data:
        code: "import json\nimport time\n\nSCHEMA_VERSION = \"evidence-export/1.0.0\"\
          \nMANIFEST_VERSION = \"run-manifest/1.0.0\"\nEXPORT_VERSION = \"export-contract/1.0.0\"\
          \n\ndef _safe_cell(value):\n    text = value if isinstance(value, str) else\
          \ json.dumps(value, ensure_ascii=False)\n    if text.startswith((\"=\",\
          \ \"+\", \"-\", \"@\")):\n        text = \"'\" + text\n    return text.replace(\"\
          \\r\", \" \").replace(\"\\n\", \" \")\n\ndef main(cards_json: str, risk_summary_json:\
          \ str, doc_format: str, processed_at: str, valid: bool = True, error_code:\
          \ str = \"\") -> dict:\n    try:\n        cards = json.loads(cards_json)\n\
          \    except Exception:\n        cards = []\n    if not valid:\n        error\
          \ = {\"code\": error_code or \"SBOM_INVALID\", \"source\": \"dify_preflight\"\
          , \"claim\": \"Input failed deterministic validation; no risk conclusion\
          \ is produced.\"}\n        manifest = {\n            \"manifest_version\"\
          : MANIFEST_VERSION,\n            \"export_contract\": EXPORT_VERSION,\n\
          \            \"generated_at\": time.strftime(\"%Y-%m-%dT%H:%M:%SZ\", time.gmtime()),\n\
          \            \"input_format\": doc_format,\n            \"processed_at\"\
          : processed_at,\n            \"rule_version\": \"risk-rules/1.0.0\",\n \
          \           \"osv_endpoint\": \"https://api.osv.dev/v1/querybatch\",\n \
          \           \"state\": \"failed\",\n            \"error\": error,\n    \
          \        \"unverified_capabilities\": [\"Dify application import/trace recorded\
          \ separately\", \"No model used\"],\n            \"summary\": {},\n    \
          \    }\n        return {\n            \"status\": \"failed\",\n        \
          \    \"evidence_json\": json.dumps({\"schema_version\": SCHEMA_VERSION,\
          \ \"generated_at\": manifest[\"generated_at\"], \"evidence\": [], \"error\"\
          : error}, ensure_ascii=False, sort_keys=True),\n            \"evidence_csv\"\
          : \"\",\n            \"run_manifest_json\": json.dumps(manifest, ensure_ascii=False,\
