      id: extract
      position:
        x: 400
        y: 300
      positionAbsolute:
        x: 400
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 1
    - data:
        code: "import json\nimport time\n\nMAX_BYTES = 2 * 1024 * 1024\nMAX_COMPONENTS\
          \ = 1000\nKNOWN_ECOSYSTEMS = {\n    \"cargo\", \"composer\", \"deb\", \"\
          golang\", \"hackage\", \"hex\", \"maven\",\n    \"npm\", \"nuget\", \"pypi\"\
          , \"rubygems\", \"cran\", \"swift\", \"apk\", \"rpm\",\n    \"conan\", \"\
          conda\", \"pub\", \"bioconductor\", \"linux\",\n}\n\ndef _purl_parts(purl):\n\
          \    if not isinstance(purl, str) or not purl.startswith(\"pkg:\"):\n  \
          \      return None\n    try:\n        rest = purl[4:]\n        ptype, _,\
          \ remainder = rest.partition(\"/\")\n        if not remainder:\n       \
          \     return None\n        name_part = remainder\n        version = None\n\
          \        if \"@\" in name_part:\n            name_part, _, version = name_part.partition(\"\
          @\")\n        return {\"type\": ptype.lower(), \"name\": name_part, \"version\"\
          : version}\n    except Exception:\n        return None\n\ndef main(sbom_text:\
          \ str) -> dict:\n    try:\n        size = len(sbom_text.encode(\"utf-8\"\
          ))\n        if size > MAX_BYTES:\n            raise ValueError(\"INPUT_TOO_LARGE\"\
          )\n        document = json.loads(sbom_text)\n        if not isinstance(document,\
          \ dict):\n            raise ValueError(\"SBOM_INVALID\")\n        if document.get(\"\
          bomFormat\") == \"CycloneDX\" and str(document.get(\"specVersion\")) ==\
          \ \"1.6\":\n            doc_format = \"CycloneDX 1.6 JSON\"\n          \
          \  raw = document.get(\"components\", [])\n            if not isinstance(raw,\
          \ list):\n                raise ValueError(\"SBOM_INVALID\")\n         \
          \   components = []\n            pending = list(raw)\n            while\
          \ pending:\n                item = pending.pop(0)\n                if not\
          \ isinstance(item, dict):\n                    raise ValueError(\"SBOM_INVALID\"\
          )\n                children = item.get(\"components\", [])\n           \
          \     if isinstance(children, list):\n                    pending[0:0] =\
          \ children\n                components.append(item)\n        elif document.get(\"\
          spdxVersion\") == \"SPDX-2.3\":\n            doc_format = \"SPDX 2.3 JSON\"\
          \n            packages = document.get(\"packages\", [])\n            if\
          \ not isinstance(packages, list):\n                raise ValueError(\"SBOM_INVALID\"\
          )\n            components = list(packages)\n        else:\n            raise\
          \ ValueError(\"SBOM_UNSUPPORTED\")\n        if len(components) > MAX_COMPONENTS:\n\
          \            raise ValueError(\"TOO_MANY_COMPONENTS\")\n        normalized\
          \ = []\n        for index, item in enumerate(components):\n            if\
          \ not isinstance(item, dict):\n                raise ValueError(\"SBOM_INVALID\"\
          )\n            name = item.get(\"name\")\n            if not isinstance(name,\
          \ str) or not name:\n                raise ValueError(\"SBOM_INVALID\")\n\
          \            version = item.get(\"version\")\n            if version is\
          \ None:\n                version = item.get(\"versionInfo\")  # SPDX 2.3\
          \ JSON names the field versionInfo\n            if version is not None and\
          \ not isinstance(version, str):\n                version = str(version)\n\
          \            purl = item.get(\"purl\") if isinstance(item.get(\"purl\"),\
          \ str) else None\n            if purl is None:\n                for ref\
          \ in item.get(\"externalRefs\", []) if isinstance(item.get(\"externalRefs\"\
          , []), list) else []:\n                    if isinstance(ref, dict) and\
          \ ref.get(\"referenceType\") == \"purl\" and isinstance(ref.get(\"referenceLocator\"\
          ), str):\n                        purl = ref[\"referenceLocator\"]\n   \
          \                     break\n            parsed = _purl_parts(purl) if purl\
          \ else None\n            ecosystem = parsed[\"type\"] if parsed else None\n\
          \            conflict = None\n            if parsed and parsed[\"version\"\
          ] and version and parsed[\"version\"] != version:\n                conflict\
          \ = \"purl version %s != declared version %s\" % (parsed[\"version\"], version)\n\
          \            if ecosystem and ecosystem not in KNOWN_ECOSYSTEMS:\n     \
          \           ecosystem = None\n            normalized.append({\n        \
          \        \"index\": index,\n                \"name\": name,\n          \
          \      \"version\": version,\n                \"purl\": purl,\n        \
          \        \"ecosystem\": ecosystem,\n                \"conflict\": conflict,\n\
          \                \"unknown_ecosystem\": ecosystem is None,\n           \
          \ })\n        return {\n            \"valid\": True,\n            \"error_code\"\
          : \"\",\n            \"doc_format\": doc_format,\n            \"processed_at\"\
          : time.strftime(\"%Y-%m-%dT%H:%M:%SZ\", time.gmtime()),\n            \"\
          components_json\": json.dumps(normalized, ensure_ascii=False, separators=(\"\
          ,\", \":\")),\n        }\n    except ValueError as exc:\n        return\
          \ {\n            \"valid\": False,\n            \"error_code\": str(exc),\n\
          \            \"doc_format\": \"\",\n            \"processed_at\": \"\",\n\
          \            \"components_json\": \"[]\",\n        }\n"
        code_language: python3
        desc: Parse, bound (2 MiB / 1000 components), and normalize components. Uploaded
          fields are untrusted data.
        outputs:
          valid:
            children: null
            type: boolean
          error_code:
            children: null
            type: string
          doc_format:
            children: null
            type: string
          processed_at:
            children: null
            type: string
          components_json:
            children: null
            type: string
        selected: false
        title: Validate and normalize
        type: code
        variables:
        - value_selector:
          - extract
          - text
          value_type: string
          variable: sbom_text
      height: 84
      id: preflight
      position:
