        body:
          data:
          - id: body-json-1
            key: ''
            type: text
            value: '{{#osv_query.querybatch_json#}}'
          type: json
        desc: Official public OSV querybatch endpoint; no key. SBOM fields cannot
          change URL, headers, or method.
        error_strategy: fail-branch
        headers: 'Content-Type: application/json'
        method: POST
        params: ''
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          connect: 10
          read: 60
          write: 60
        title: OSV querybatch (official API)
        type: http-request
        url: https://api.osv.dev/v1/querybatch
      height: 126
      id: osv_http
      position:
        x: 1360
        y: 300
      positionAbsolute:
        x: 1360
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 1
    - data:
        code: "import json\nimport time\n\ndef main(response_body: str, skipped_json:\
          \ str, queryable_count: str) -> dict:\n    try:\n        queryable = int(queryable_count\
          \ or 0)\n    except Exception:\n        queryable = 0\n    try:\n      \
          \  payload = json.loads(response_body)\n        results = payload.get(\"\
          results\")\n        if not isinstance(results, list):\n            raise\
          \ ValueError(\"OSV_PROTOCOL_ERROR\")\n    except Exception:\n        return\
          \ {\n            \"components_json\": \"[]\",\n            \"osv_queried_at\"\
          : \"\",\n            \"osv_error\": \"OSV_PROTOCOL_ERROR\",\n          \
          \  \"queryable_count\": str(queryable),\n            \"partial\": True,\n\
          \        }\n    parsed = []\n    for index, result in enumerate(results):\n\
          \        if not isinstance(result, dict):\n            parsed.append({\"\
          index\": index, \"vulns\": [], \"error\": \"OSV_PROTOCOL_ERROR\"})\n   \
          \         continue\n        vulns = result.get(\"vulns\", [])\n        items\
          \ = []\n        if isinstance(vulns, list):\n            for vuln in vulns:\n\
          \                if not isinstance(vuln, dict):\n                    continue\n\
          \                vid = vuln.get(\"id\")\n                if not isinstance(vid,\
          \ str):\n                    continue\n                aliases = vuln.get(\"\
          aliases\", [])\n                items.append({\n                    \"id\"\
          : vid,\n                    \"aliases\": aliases if isinstance(aliases,\
          \ list) else [],\n                    \"summary\": vuln.get(\"summary\"\
          ) if isinstance(vuln.get(\"summary\"), str) else None,\n               \
          \     \"details\": vuln.get(\"details\") if isinstance(vuln.get(\"details\"\
          ), str) else None,\n                    \"affected\": vuln.get(\"affected\"\
          ) if isinstance(vuln.get(\"affected\"), list) else [],\n               \
          \     \"modified\": vuln.get(\"modified\") if isinstance(vuln.get(\"modified\"\
          ), str) else None,\n                })\n        parsed.append({\"index\"\
          : index, \"vulns\": items, \"error\": None})\n    try:\n        skipped\
          \ = json.loads(skipped_json)\n    except Exception:\n        skipped = []\n\
          \    return {\n        \"components_json\": json.dumps(parsed, ensure_ascii=False,\
          \ separators=(\",\", \":\")),\n        \"osv_queried_at\": time.strftime(\"\
          %Y-%m-%dT%H:%M:%SZ\", time.gmtime()),\n        \"osv_error\": \"\",\n  \
          \      \"queryable_count\": str(queryable),\n        \"partial\": False,\n\
          \    }\n"
        code_language: python3
        desc: Map querybatch results back to components; protocol errors become per-component
          unknown, never a safety claim.
        outputs:
          components_json:
            children: null
            type: string
          osv_queried_at:
            children: null
            type: string
          osv_error:
            children: null
            type: string
          queryable_count:
            children: null
            type: string
          partial:
            children: null
            type: boolean
        selected: false
        title: Parse OSV responses
        type: code
        variables:
        - value_selector:
          - osv_http
          - body
          value_type: string
          variable: response_body
        - value_selector:
          - osv_query
          - skipped_json
          value_type: string
          variable: skipped_json
        - value_selector:
          - osv_query
          - queryable_count
          value_type: string
          variable: queryable_count
      height: 84
      id: osv_parse
      position:
        x: 1680
        y: 300
      positionAbsolute:
        x: 1680
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 1
    - data:
        code: "import json\nimport time\n\ntry:\n    import requests  # noqa: PLC0415\
          \  (sandbox ships requests; proxy env is preconfigured)\nexcept Exception:\
          \  # pragma: no cover\n    requests = None\n\nKEV_SUBSET = {\n    \"CVE-2021-44228\"\
          : {\"name\": \"Apache Log4j2\", \"date_added\": \"2021-12-10\", \"required_action\"\
          : \"Apply updates per vendor instructions.\"},\n    \"CVE-2021-41773\":\
          \ {\"name\": \"Apache HTTP Server\", \"date_added\": \"2021-10-04\", \"\
          required_action\": \"Apply updates per vendor instructions.\"},\n    \"\
          CVE-2023-4863\": {\"name\": \"WebP (multiple products)\", \"date_added\"\
          : \"2023-09-15\", \"required_action\": \"Apply updates per vendor instructions.\"\
          },\n}\nKEV_SNAPSHOT = \"2026-08-10T16:19:34.1767Z\"\nKEV_SHA256 = \"89689b4485bf16702a36dde7c901766d56521720f79275425e07a77763e26c73\"\
          \nRULE_VERSION = \"risk-rules/1.0.0\"\nOSV_SOURCE = \"https://api.osv.dev/v1/querybatch\"\
          \nKEV_SOURCE = \"https://www.cisa.gov/known-exploited-vulnerabilities-catalog\"\
          \nDISCLAIMER = (\n    \"This evidence card is generated deterministically.\
          \ 'no_match' means the \"\n    \"OSV query returned no vulnerability at\
          \ query time; it is not proof of \"\n    \"safety. KEV snapshot: %s. Data\
          \ cutoff is visible per source.\" % KEV_SNAPSHOT\n)\n\ndef _resolve_kev_osv_ids():\n\
          \    \"\"\"Reverse-resolve each pinned KEV CVE through OSV detail lookups\
          \ (bounded\n    to the three pinned CVEs). Failures degrade to an empty\
          \ mapping; a missing\n    mapping can only downgrade a conclusion, never\
          \ fabricate one.\"\"\"\n    resolved = {}\n    if requests is None:\n  \
          \      return resolved\n    for cve in KEV_SUBSET:\n        try:\n     \
          \       response = requests.get(\"https://api.osv.dev/v1/vulns/\" + cve,\
          \ timeout=8)\n            if response.status_code != 200:\n            \
          \    continue\n            detail = response.json()\n            ids = [detail.get(\"\
          id\")] + list(detail.get(\"aliases\", []))\n            for vid in ids:\n\
          \                if isinstance(vid, str) and vid:\n                    resolved[vid]\
          \ = cve\n        except Exception:\n            continue\n    return resolved\n\
          \ndef main(components_json: str, osv_queried_at: str, skipped_json: str)\
          \ -> dict:\n    try:\n        results = json.loads(components_json)\n  \
          \  except Exception:\n        results = []\n    try:\n        skipped =\
          \ json.loads(skipped_json)\n    except Exception:\n        skipped = []\n\
          \    kev_osv_ids = _resolve_kev_osv_ids()\n    cards = []\n    for result\
          \ in results:\n        index = result.get(\"index\", 0)\n        vulns =\
          \ result.get(\"vulns\", [])\n        error = result.get(\"error\")\n   \
          \     if error:\n            state = \"unknown\"\n            reason = \"\
          OSV query failed: %s\" % error\n        elif vulns:\n            matched\
          \ = None\n            for vuln in vulns:\n                cve = kev_osv_ids.get(vuln.get(\"\
          id\"))\n                if cve:\n                    matched = (cve, KEV_SUBSET[cve])\n\
          \                    break\n            if matched:\n                state\
          \ = \"known_exploited\"\n                reason = None\n            else:\n\
          \                state = \"vulnerable_evidence_incomplete\"\n          \
          \      reason = \"OSV reports vulnerability but no verified CISA KEV match\
          \ in snapshot %s\" % KEV_SNAPSHOT\n        else:\n            state = \"\
          no_match\"\n            reason = \"Completed OSV query returned no vulnerability;\
          \ this is not proof of safety.\"\n        card = {\n            \"component_index\"\
          : index,\n            \"state\": state,\n            \"reason\": reason,\n\
          \            \"osv_queried_at\": osv_queried_at,\n            \"kev_snapshot\"\
          : KEV_SNAPSHOT,\n            \"kev_sha256\": KEV_SHA256,\n            \"\
          rule_version\": RULE_VERSION,\n            \"sources\": {\"osv\": OSV_SOURCE,\
          \ \"kev\": KEV_SOURCE},\n            \"vulnerabilities\": vulns,\n     \
          \       \"disclaimer\": DISCLAIMER,\n        }\n        cards.append(card)\n\
          \    unknown = []\n    for item in skipped:\n        reason = None\n   \
          \     if item.get(\"conflict\"):\n            reason = \"version conflict:\
          \ %s\" % item[\"conflict\"]\n        elif item.get(\"unknown_ecosystem\"\
          ):\n            reason = \"unknown ecosystem without queryable purl\"\n\
          \        else:\n            reason = \"not queryable\"\n        unknown.append({\n\
          \            \"component_index\": item.get(\"index\", 0),\n            \"\
          state\": \"unknown\",\n            \"reason\": reason,\n            \"osv_queried_at\"\
          : osv_queried_at,\n            \"kev_snapshot\": KEV_SNAPSHOT,\n       \
          \     \"kev_sha256\": KEV_SHA256,\n            \"rule_version\": RULE_VERSION,\n\
          \            \"sources\": {\"osv\": OSV_SOURCE, \"kev\": KEV_SOURCE},\n\
          \            \"vulnerabilities\": [],\n            \"disclaimer\": DISCLAIMER,\n\
          \        })\n    cards.extend(unknown)\n    summary = {\"cards\": len(cards),\
          \ \"known_exploited\": 0, \"vulnerable_evidence_incomplete\": 0, \"no_match\"\
          : 0, \"unknown\": 0}\n    for card in cards:\n        summary[card[\"state\"\
          ]] = summary.get(card[\"state\"], 0) + 1\n    return {\n        \"cards_json\"\
          : json.dumps(cards, ensure_ascii=False, separators=(\",\", \":\")),\n  \
          \      \"risk_summary_json\": json.dumps(summary, sort_keys=True, separators=(\"\
          ,\", \":\")),\n    }\n"
        code_language: python3
        desc: Cross-reference OSV ids/aliases with the pinned CISA KEV subset; deterministic
          risk-rules/1.0.0 states.
        outputs:
          cards_json:
            children: null
            type: string
          risk_summary_json:
            children: null
            type: string
        selected: false
        title: KEV cross-reference and risk rules
        type: code
        variables:
        - value_selector:
