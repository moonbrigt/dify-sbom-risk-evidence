    - data:
        code: "import json\n\ndef _versionless_purl(purl):\n    \"\"\"Strip a trailing\
          \ @version from a purl, keeping scoped names like pkg:npm/@scope/name.\"\
          \"\"\n    if \"@\" not in purl:\n        return purl\n    head, _sep, tail\
          \ = purl.rpartition(\"@\")\n    if not head or not tail or \"/\" in tail:\n\
          \        return purl\n    return head\n\ndef main(components_json: str)\
          \ -> dict:\n    try:\n        components = json.loads(components_json)\n\
          \    except Exception:\n        components = []\n    queries = []\n    skipped\
          \ = []\n    for item in components:\n        if item.get(\"conflict\") or\
          \ item.get(\"unknown_ecosystem\") or not item.get(\"purl\"):\n         \
          \   skipped.append(item)\n            continue\n        version = item.get(\"\
          version\") or \"\"\n        query = {\"package\": {\"purl\": _versionless_purl(item[\"\
          purl\"])}, \"version\": version}\n        queries.append(query)\n    return\
          \ {\n        \"querybatch_json\": json.dumps({\"queries\": queries}, ensure_ascii=False,\
          \ separators=(\",\", \":\")),\n        \"queryable_count\": str(len(queries)),\n\
          \        \"skipped_json\": json.dumps(skipped, ensure_ascii=False, separators=(\"\
          ,\", \":\")),\n    }\n"
        code_language: python3
        desc: Build a bounded v1/querybatch request from normalized components; conflicts
          and unknown ecosystems are skipped.
        outputs:
          querybatch_json:
            children: null
            type: string
          queryable_count:
            children: null
            type: string
          skipped_json:
            children: null
            type: string
        selected: false
        title: Build OSV query batch
        type: code
        variables:
        - value_selector:
          - preflight
          - components_json
          value_type: string
          variable: components_json
      height: 84
